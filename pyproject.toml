[project]
name = "orchestra"
version = "0.1.0"
description = "Multi-agent orchestration platform: supervisor decomposition, tool-using subagents, persistent memory, human-in-the-loop escalation, and full observability."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "anthropic>=0.40",
    "mcp>=1.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "chromadb>=0.5",
    "redis>=5.0",
    "celery>=5.4",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
